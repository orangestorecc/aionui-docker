name: build-and-push

# Publica a imagem do AionUi WebUI no GHCR.
#
# O build é pesado (~3200 pacotes, bundle de ~10.300 módulos, pico acima de
# 3 GB de heap) e por isso não roda no servidor da N49, que hospeda produção.
# Aqui o runner tem 16 GB e o Coolify só faz `docker pull`.

on:
  workflow_dispatch:
    inputs:
      aionui_ref:
        description: 'Tag do AionUi (vazio = último release)'
        required: false
        default: ''
      aioncore_version:
        description: 'Tag do AionCore (vazio = último release)'
        required: false
        default: ''
      force:
        description: 'Rebuildar mesmo se a tag já existir no GHCR'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/build.yml']
  schedule:
    # Diário às 06:00 UTC: pega bump de versão do AionUi sem intervenção.
    - cron: '0 6 * * *'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # As duas versões andam juntas: o commit que sobe o AionUi para 2.1.57
      # sobe o aioncore para v0.1.68. Resolvidas juntas para não dessincronizar.
      - name: Resolver versões
        id: ver
        run: |
          set -euo pipefail
          AIONUI="${{ inputs.aionui_ref }}"
          AIONCORE="${{ inputs.aioncore_version }}"

          if [ -z "$AIONUI" ]; then
            AIONUI=$(gh api repos/iOfficeAI/AionUi/releases/latest --jq .tag_name)
          fi
          if [ -z "$AIONCORE" ]; then
            AIONCORE=$(gh api repos/iOfficeAI/AionCore/releases/latest --jq .tag_name)
          fi

          echo "aionui=$AIONUI"     >> "$GITHUB_OUTPUT"
          echo "aioncore=$AIONCORE" >> "$GITHUB_OUTPUT"
          echo "tag=${AIONUI#v}"    >> "$GITHUB_OUTPUT"
          echo "AionUi $AIONUI + AionCore $AIONCORE" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sem isso o cron diário reconstruiria a mesma versão todo dia.
      - name: A tag já existe no GHCR?
        id: exists
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${IMAGE}:${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Imagem ${IMAGE}:${{ steps.ver.outputs.tag }} já publicada — nada a fazer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      # Build sem publicar: o smoke test abaixo precisa da imagem carregada
      # localmente. Publicar antes de testar já nos custou deploys quebrados.
      - name: Build (local)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aionui-test:smoke
          build-args: |
            AIONUI_REF=${{ steps.ver.outputs.aionui }}
            AIONCORE_VERSION=${{ steps.ver.outputs.aioncore }}
            NODE_HEAP_MB=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rede de segurança do multi-stage: se algum arquivo necessário em runtime
      # ficou fora do COPY, o container não sobe — e queremos descobrir aqui, não
      # no servidor de produção.
      - name: Smoke test
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          echo "### Tamanho da imagem" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect aionui-test:smoke --format '{{.Size}}' \
            | awk '{printf "`%.0f MB`\n", $1/1048576}' >> "$GITHUB_STEP_SUMMARY"

          docker run -d --name smoke -v smokedata:/data -p 3000:3000 aionui-test:smoke

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "/health respondeu na tentativa $i"
              OK=1; break
            fi
            sleep 5
          done

          if [ "${OK:-0}" != "1" ]; then
            echo "::error::/health nao respondeu em 5 minutos"
            docker logs smoke | tail -80
            exit 1
          fi

          # Confirma que o processo que serve nao esta root: o Claude Code recusa
          # a flag do AionUi sob root, que foi a causa do USER_AGENT_DISCONNECTED.
          #
          # Precisa olhar o PID 1, nao `docker exec id -un`: o exec cria um
          # processo novo com o usuario padrao da imagem (root) e nao herda o
          # gosu do entrypoint. stat em /proc/1 nao depende de procps.
          WHO=$(docker exec smoke stat -c %U /proc/1)
          echo "usuario do PID 1: $WHO"
          [ "$WHO" = "node" ] || { echo "::error::PID 1 roda como $WHO, esperado node"; exit 1; }

          # E que os CLIs de agente funcionam para esse usuario (-u node).
          docker exec -u node smoke claude --version
          docker exec -u node smoke aioncore --version
          docker logs smoke | tail -20

      - name: Push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            AIONUI_REF=${{ steps.ver.outputs.aionui }}
            AIONCORE_VERSION=${{ steps.ver.outputs.aioncore }}
            NODE_HEAP_MB=6144
          cache-from: type=gha
